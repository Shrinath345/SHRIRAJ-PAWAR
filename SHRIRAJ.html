<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shriraj Pawar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            animation: zoomIn 2s ease-out;
        }

        h1 {
            color: white;
            font-size: clamp(45px, 9vw, 110px);
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .line {
            width: 0;
            height: 3px;
            margin: 20px auto;
            background: white;
            animation: lineGrow 1.5s ease-out 1.2s forwards;
        }

        p {
            color: #aaa;
            font-size: 18px;
            letter-spacing: 5px;
            opacity: 0;
            animation: fadeUp 1s ease-out 1.5s forwards;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.3);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px white;
            }

            to {
                text-shadow:
                    0 0 10px white,
                    0 0 25px #00bfff,
                    0 0 50px #00bfff;
            }
        }

        @keyframes lineGrow {
            to {
                width: 60%;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Shriraj Pawar</h1>
        <div class="line"></div>
        <p>WELCOME</p>
    </div>

</body>
</html>
